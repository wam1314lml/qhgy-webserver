<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="huaweiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E60012;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8102E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 华为红色圆形背景 -->
  <circle cx="100" cy="100" r="90" fill="url(#huaweiGrad)"/>
  
  <!-- 华为LOGO - 花瓣形状 -->
  <g fill="#FFFFFF">
    <!-- 中心圆 -->
    <circle cx="100" cy="100" r="15"/>
    
    <!-- 8个花瓣 -->
    <ellipse cx="100" cy="55" rx="12" ry="30" transform="rotate(0 100 100)"/>
    <ellipse cx="131" cy="69" rx="12" ry="30" transform="rotate(45 100 100)"/>
    <ellipse cx="145" cy="100" rx="12" ry="30" transform="rotate(90 100 100)"/>
    <ellipse cx="131" cy="131" rx="12" ry="30" transform="rotate(135 100 100)"/>
    <ellipse cx="100" cy="145" rx="12" ry="30" transform="rotate(180 100 100)"/>
    <ellipse cx="69" cy="131" rx="12" ry="30" transform="rotate(225 100 100)"/>
    <ellipse cx="55" cy="100" rx="12" ry="30" transform="rotate(270 100 100)"/>
    <ellipse cx="69" cy="69" rx="12" ry="30" transform="rotate(315 100 100)"/>
  </g>
</svg>
